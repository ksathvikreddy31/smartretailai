name: Build and Deploy Smart Retail AI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: smart-retail-system

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================================
      # CHECKOUT CODE
      # =========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================================
      # LOGIN TO ACR
      # =========================================
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # =========================================
      # BUILD + PUSH IMAGE
      # =========================================
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # =========================================
      # AZURE LOGIN
      # =========================================
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =========================================
      # DEPLOY WEB APP
      # =========================================
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
